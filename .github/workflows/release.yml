name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_DIR: apps/decent-bench
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter_target: linux
            bundle_path: build/linux/x64/release/bundle
            native_archive_extension: tar.gz
            native_lib_name: libdecentdb.so
            archive_extension: tar.gz
          - os: macos-latest
            flutter_target: macos
            bundle_path: build/macos/Build/Products/Release/decent_bench.app
            native_archive_extension: tar.gz
            native_lib_name: libdecentdb.dylib
            archive_extension: tar.gz
          - os: windows-latest
            flutter_target: windows
            bundle_path: build/windows/x64/runner/Release
            native_archive_extension: zip
            native_lib_name: decentdb.dll
            archive_extension: zip

    steps:
      - name: Check out Decent Bench
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          cache: true

      - name: Resolve release platform metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_ARCH" in
            X64) arch_suffix=x64 ;;
            ARM64) arch_suffix=arm64 ;;
            *)
              echo "Unsupported runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          case "$RUNNER_OS" in
            Linux) decentdb_release_suffix="Linux-$arch_suffix" ;;
            macOS) decentdb_release_suffix="macOS-$arch_suffix" ;;
            Windows) decentdb_release_suffix="Windows-$arch_suffix" ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          echo "app_arch_suffix=$arch_suffix" >> "$GITHUB_OUTPUT"
          echo "decentdb_release_suffix=$decentdb_release_suffix" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Resolve locked DecentDB version
        id: decentdb-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          from pathlib import Path

          lines = Path("apps/decent-bench/pubspec.lock").read_text().splitlines()
          inside = False
          for line in lines:
              if line.startswith("  decentdb:"):
                  inside = True
                  continue
              if inside and line.startswith("  ") and not line.startswith("    "):
                  break
              if inside and line.strip().startswith("version: "):
                  print(line.split('"')[1])
                  raise SystemExit(0)
          raise SystemExit("decentdb version not found in apps/decent-bench/pubspec.lock")
          PY
          )"
          tag="v${version}"
          git ls-remote --tags --refs https://github.com/sphildreth/decentdb.git "${tag}" | grep -q .
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download DecentDB release assets (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.decentdb-version.outputs.tag }}"
          dart_native_asset="decentdb-dart-native-${tag}-${{ steps.release-meta.outputs.decentdb_release_suffix }}.${{ matrix.native_archive_extension }}"
          runtime_asset="decentdb-${tag}-${{ steps.release-meta.outputs.decentdb_release_suffix }}.${{ matrix.native_archive_extension }}"
          dart_native_url="https://github.com/sphildreth/decentdb/releases/download/${tag}/${dart_native_asset}"
          runtime_url="https://github.com/sphildreth/decentdb/releases/download/${tag}/${runtime_asset}"
          work_dir="$RUNNER_TEMP/decentdb-native"
          tools_dir="$RUNNER_TEMP/decentdb-tools"
          dart_native_archive_path="$RUNNER_TEMP/$dart_native_asset"
          runtime_archive_path="$RUNNER_TEMP/$runtime_asset"
          mkdir -p "$work_dir" "$tools_dir"
          curl -fsSL --retry 3 --retry-delay 2 "$dart_native_url" -o "$dart_native_archive_path"
          tar -xzf "$dart_native_archive_path" -C "$work_dir"
          curl -fsSL --retry 3 --retry-delay 2 "$runtime_url" -o "$runtime_archive_path"
          tar -xzf "$runtime_archive_path" -C "$tools_dir"
          native_path="$work_dir/${{ matrix.native_lib_name }}"
          migration_tool_path="$(find "$tools_dir" -type f -name decentdb-migrate -print -quit)"
          cli_path="$(find "$tools_dir" -type f -name decentdb -print -quit)"
          if [ ! -f "$native_path" ]; then
            echo "Expected DecentDB native library at $native_path." >&2
            find "$work_dir" -maxdepth 3 -type f >&2
            exit 1
          fi
          if [ -z "$migration_tool_path" ] || [ -z "$cli_path" ]; then
            echo "Expected DecentDB CLI tools in $tools_dir." >&2
            find "$tools_dir" -maxdepth 3 -type f >&2
            exit 1
          fi
          chmod 755 "$migration_tool_path" "$cli_path"
          echo "DECENTDB_NATIVE_PATH=$native_path" >> "$GITHUB_ENV"
          echo "DECENTDB_MIGRATE_PATH=$migration_tool_path" >> "$GITHUB_ENV"
          echo "DECENTDB_CLI_PATH=$cli_path" >> "$GITHUB_ENV"

      - name: Download DecentDB release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.decentdb-version.outputs.tag }}"
          $dartNativeAsset = "decentdb-dart-native-$tag-${{ steps.release-meta.outputs.decentdb_release_suffix }}.${{ matrix.native_archive_extension }}"
          $runtimeAsset = "decentdb-$tag-${{ steps.release-meta.outputs.decentdb_release_suffix }}.${{ matrix.native_archive_extension }}"
          $dartNativeUrl = "https://github.com/sphildreth/decentdb/releases/download/$tag/$dartNativeAsset"
          $runtimeUrl = "https://github.com/sphildreth/decentdb/releases/download/$tag/$runtimeAsset"
          $workDir = Join-Path $env:RUNNER_TEMP "decentdb-native"
          $toolsDir = Join-Path $env:RUNNER_TEMP "decentdb-tools"
          $dartNativeArchivePath = Join-Path $env:RUNNER_TEMP $dartNativeAsset
          $runtimeArchivePath = Join-Path $env:RUNNER_TEMP $runtimeAsset
          function Invoke-DownloadWithRetry {
            param(
              [string] $Uri,
              [string] $OutFile
            )
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile
                return
              } catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }
          New-Item -ItemType Directory -Force $workDir | Out-Null
          New-Item -ItemType Directory -Force $toolsDir | Out-Null
          Invoke-DownloadWithRetry -Uri $dartNativeUrl -OutFile $dartNativeArchivePath
          Expand-Archive -Path $dartNativeArchivePath -DestinationPath $workDir -Force
          Invoke-DownloadWithRetry -Uri $runtimeUrl -OutFile $runtimeArchivePath
          Expand-Archive -Path $runtimeArchivePath -DestinationPath $toolsDir -Force
          $nativePath = Join-Path $workDir "${{ matrix.native_lib_name }}"
          $migrationToolPath = Get-ChildItem -Path $toolsDir -Filter "decentdb-migrate.exe" -File -Recurse | Select-Object -First 1
          $cliPath = Get-ChildItem -Path $toolsDir -Filter "decentdb.exe" -File -Recurse | Select-Object -First 1
          if (-not (Test-Path $nativePath -PathType Leaf)) {
            throw "Expected DecentDB native library at $nativePath."
          }
          if ($null -eq $migrationToolPath -or $null -eq $cliPath) {
            throw "Expected DecentDB CLI tools in $toolsDir."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "DECENTDB_NATIVE_PATH=$nativePath"
          Add-Content -Path $env:GITHUB_ENV -Value "DECENTDB_MIGRATE_PATH=$($migrationToolPath.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "DECENTDB_CLI_PATH=$($cliPath.FullName)"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Flutter build ${{ matrix.flutter_target }}
        if: runner.os != 'Windows'
        working-directory: ${{ env.APP_DIR }}
        run: flutter build ${{ matrix.flutter_target }}

      - name: Flutter build windows
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: flutter build windows -v

      - name: Dump Windows CMake diagnostics
        if: failure() && runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $paths = @(
            "build/windows/x64/CMakeFiles/CMakeError.log",
            "build/windows/x64/CMakeFiles/CMakeOutput.log",
            "build/windows/x64/CMakeFiles/CMakeConfigureLog.yaml"
          )

          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              continue
            }

            Write-Host "::group::$path"
            Get-Content $path
            Write-Host "::endgroup::"
          }

      - name: Resolve desktop bundle path
        id: bundle
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_path="${{ matrix.bundle_path }}"

          if [ "$RUNNER_OS" = "macOS" ] && [ ! -d "$bundle_path" ]; then
            shopt -s nullglob
            matches=(build/macos/Build/Products/Release/*.app)
            shopt -u nullglob
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one macOS app bundle, found ${#matches[@]}." >&2
              exit 1
            fi
            bundle_path="${matches[0]}"
          fi

          if [ ! -e "$bundle_path" ]; then
            echo "Bundle path does not exist: $bundle_path" >&2
            exit 1
          fi

          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Compute artifact name
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "name=decent-bench-${GITHUB_REF_NAME}-${RUNNER_OS}-${{ steps.release-meta.outputs.app_arch_suffix }}.${{ matrix.archive_extension }}" >> "$GITHUB_OUTPUT"

      - name: Stage DecentDB native library into bundle
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/stage_decentdb_native.dart --bundle "${{ steps.bundle.outputs.path }}" --source "${{ env.DECENTDB_NATIVE_PATH }}" --migration-tool-source "${{ env.DECENTDB_MIGRATE_PATH }}" --cli-source "${{ env.DECENTDB_CLI_PATH }}"

      - name: Verify bundled native library
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/stage_decentdb_native.dart --bundle "${{ steps.bundle.outputs.path }}" --verify-only

      - name: Package release artifact (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$RUNNER_TEMP/release-stage"
          package_root="decent-bench-${GITHUB_REF_NAME}-${RUNNER_OS}-${{ steps.release-meta.outputs.app_arch_suffix }}"
          stage_dir="$stage_root/$package_root"
          bundle_path="${{ steps.bundle.outputs.path }}"

          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"

          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$bundle_path" "$stage_dir/"
          else
            cp -R "$bundle_path"/. "$stage_dir/"
          fi

          tar -C "$stage_root" -czf "${{ steps.artifact.outputs.name }}" "$package_root"

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $stageRoot = Join-Path $env:RUNNER_TEMP "release-stage"
          $packageRoot = "decent-bench-$env:GITHUB_REF_NAME-$env:RUNNER_OS-${{ steps.release-meta.outputs.app_arch_suffix }}"
          $stageDir = Join-Path $stageRoot $packageRoot
          $bundlePath = "${{ steps.bundle.outputs.path }}"

          if (Test-Path $stageDir) {
            Remove-Item -Recurse -Force $stageDir
          }
          New-Item -ItemType Directory -Force $stageDir | Out-Null
          Get-ChildItem -Force $bundlePath | Copy-Item -Destination $stageDir -Recurse -Force
          Compress-Archive -Path $stageDir -DestinationPath "${{ steps.artifact.outputs.name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ env.APP_DIR }}/${{ steps.artifact.outputs.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/decent-bench-${{ github.ref_name }}-Linux-*.tar.gz
            artifacts/**/decent-bench-${{ github.ref_name }}-macOS-*.tar.gz
            artifacts/**/decent-bench-${{ github.ref_name }}-Windows-*.zip
