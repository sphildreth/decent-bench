schema_version = 1
id = "csv"
kind = "source"
status = "complete"
priority = "P0"
legacy_format_key = "csv"
name = "CSV"
family = "delimited_text"
summary = "Delimited text import with comma defaults."
description = "Delimited text import with header, delimiter, quoting, preview, transforms, and type overrides."

[detection]
extensions = [".csv"]
mime_types = []
filename_patterns = []
magic_numbers = []
priority = 100

[support]
implementation = "generic_wizard"
availability = "builtin"
min_app_version = "0.0.0"
requires_dependency_review = false
requires_adr = false

[capabilities]
detect_by_extension = true
detect_by_signature = false
inspect_schema = true
preview_rows = true
import_full = true
import_selected_tables = false
supports_multiple_tables = false
supports_archives = false
supports_streaming_preview = false
supports_streaming_import = false
supports_cancellation = true
supports_rejected_rows = true
preserves_logical_types = false
preserves_constraints = false
preserves_indexes = false
preserves_relationships = false
can_export_recipe = true

[adapter]
id = "generic_delimited"
kind = "dart_generic"
protocol = "dart_import_adapter_v1"

[[actions]]
id = "inspect_schema"
label = "Inspect Source"
required = true

[[actions]]
id = "preview_rows"
label = "Preview Rows"
required = true

[[actions]]
id = "import_full"
label = "Import"
required = true

[[options]]
id = "header_row"
label = "Header Row"
type = "boolean"
default = true
required = true

[[options]]
id = "delimiter"
label = "Delimiter"
type = "string"
default = ","
required = true

[[options]]
id = "quote_character"
label = "Quote Character"
type = "string"
default = "\""
required = true

[[options]]
id = "escape_character"
label = "Escape Character"
type = "string"
default = "\""
required = true

[[options]]
id = "encoding"
label = "Encoding"
type = "enumeration"
default = "auto"
required = true
allowed_values = ["auto", "utf8", "latin1"]

[[options]]
id = "malformed_row_strategy"
label = "Malformed Row Strategy"
type = "enumeration"
default = "padOrTruncate"
required = true
allowed_values = ["padOrTruncate", "skipRow"]

[[type_mappings]]
source_type = "text"
target_type = "TEXT/INTEGER/REAL/BOOLEAN/DATE/TIMESTAMP"
fidelity = "coerced"
notes = "Text values are inferred from samples and can be overridden."

[documentation]
help_topic = "importing-data"
format_docs = "README.md"
fixture_notes = "fixtures/README.md"

[[fixtures]]
id = "csv_smoke"
path = "fixtures/README.md"
purpose = "Module fixture contract and generation notes."
expected_tables = []
expected_warnings = []
generated = true
