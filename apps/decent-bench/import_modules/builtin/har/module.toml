schema_version = 1
id = "har"
kind = "source"
status = "complete"
priority = "P1"
legacy_format_key = "har"
name = "HAR"
family = "logs_events"
summary = "Browser HTTP archive import."
description = "HAR import that maps requests, responses, timings, and headers into linked DecentDB tables."

[detection]
extensions = [".har"]
mime_types = []
filename_patterns = []
magic_numbers = []
priority = 100

[support]
implementation = "generic_wizard"
availability = "builtin"
min_app_version = "0.0.0"
requires_dependency_review = false
requires_adr = false

[capabilities]
detect_by_extension = true
detect_by_signature = false
inspect_schema = true
preview_rows = true
import_full = true
import_selected_tables = false
supports_multiple_tables = true
supports_archives = false
supports_streaming_preview = false
supports_streaming_import = false
supports_cancellation = true
supports_rejected_rows = true
preserves_logical_types = false
preserves_constraints = false
preserves_indexes = false
preserves_relationships = false
can_export_recipe = true

[adapter]
id = "generic_har"
kind = "dart_generic"
protocol = "dart_import_adapter_v1"

[[actions]]
id = "inspect_schema"
label = "Inspect Source"
required = true

[[actions]]
id = "preview_rows"
label = "Preview Rows"
required = true

[[actions]]
id = "import_full"
label = "Import"
required = true

[[type_mappings]]
source_type = "har_json_scalar"
target_type = "TEXT/INTEGER/REAL/BOOLEAN/DATE/TIMESTAMP"
fidelity = "coerced"
notes = "HAR request, response, timing, and header scalar values are mapped into linked tables and inferred from samples."

[documentation]
help_topic = "importing-data"
format_docs = "README.md"
fixture_notes = "fixtures/README.md"

[[fixtures]]
id = "har_smoke"
path = "fixtures/README.md"
purpose = "Module fixture contract and generation notes."
expected_tables = []
expected_warnings = []
generated = true
