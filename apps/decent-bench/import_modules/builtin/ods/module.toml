schema_version = 1
id = "ods"
kind = "source"
status = "complete"
priority = "P1"
legacy_format_key = "ods"
name = "OpenDocument Spreadsheet"
family = "spreadsheet"
summary = "LibreOffice/OpenOffice spreadsheet import."
description = "ODS workbook import with worksheet selection through the generic multi-table import flow."

[detection]
extensions = [".ods"]
mime_types = []
filename_patterns = []
magic_numbers = []
