schema_version = 1
id = "sqlite"
kind = "source"
status = "complete"
priority = "P0"
legacy_format_key = "sqlite"
name = "SQLite"
family = "database"
summary = "SQLite database import."
description = "Existing SQLite import wizard and background worker path."

[detection]
extensions = [".db", ".sqlite", ".sqlite3"]
mime_types = []
filename_patterns = []
magic_numbers = []
priority = 100

[support]
implementation = "dedicated_wizard"
availability = "builtin"
min_app_version = "0.0.0"
requires_dependency_review = false
requires_adr = false

[capabilities]
detect_by_extension = true
detect_by_signature = false
inspect_schema = true
preview_rows = true
import_full = true
import_selected_tables = true
supports_multiple_tables = true
supports_archives = false
supports_streaming_preview = false
supports_streaming_import = false
supports_cancellation = true
supports_rejected_rows = false
preserves_logical_types = true
preserves_constraints = false
preserves_indexes = false
preserves_relationships = false
can_export_recipe = true

[adapter]
id = "legacy_sqlite"
kind = "legacy_wizard"
protocol = "dart_import_adapter_v1"

[[actions]]
id = "inspect_schema"
label = "Inspect Source"
required = true

[[actions]]
id = "preview_rows"
label = "Preview Rows"
required = true

[[actions]]
id = "import_selected_tables"
label = "Import Selected Tables"
required = true

[[type_mappings]]
source_type = "database_column"
target_type = "DecentDB column type"
fidelity = "lossless_with_metadata"
notes = "Source column declarations are mapped into DecentDB-compatible target types."

[[checks]]
id = "sqlite.signature"
name = "SQLite Signature"
description = "Warn when a SQLite-like extension does not have the SQLite header."
default_enabled = true
severity = "warning"

[documentation]
help_topic = "importing-data"
format_docs = "README.md"
fixture_notes = "fixtures/README.md"

[[fixtures]]
id = "sqlite_smoke"
path = "fixtures/README.md"
purpose = "Module fixture contract and generation notes."
expected_tables = []
expected_warnings = []
generated = true
