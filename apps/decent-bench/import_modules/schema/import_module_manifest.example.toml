schema_version = 1
id = "csv"
kind = "source"
status = "complete"
priority = "P0"
legacy_format_key = "csv"
name = "CSV"
family = "delimited_text"
summary = "Comma-separated text import."
description = """
Imports comma-separated text files through the generic import wizard with
header detection, preview, type inference, transforms, progress, cancellation,
and DecentDB table creation.
"""
note = "Use delimiter and malformed-row options to adapt messy exports."

[detection]
extensions = [".csv"]
mime_types = ["text/csv"]
filename_patterns = []
magic_numbers = []
priority = 100

[support]
implementation = "generic_wizard"
availability = "builtin"
min_app_version = "0.0.0"
requires_dependency_review = false
requires_adr = false

[capabilities]
detect_by_extension = true
detect_by_signature = false
inspect_schema = true
preview_rows = true
import_full = true
import_selected_tables = false
supports_multiple_tables = false
supports_archives = false
supports_streaming_preview = false
supports_streaming_import = false
supports_cancellation = true
supports_rejected_rows = true
preserves_logical_types = false
preserves_constraints = false
preserves_indexes = false
preserves_relationships = false
can_export_recipe = true

[adapter]
id = "generic_delimited"
kind = "dart_generic"
protocol = "dart_import_adapter_v1"

[[actions]]
id = "inspect_schema"
label = "Inspect Source"
required = true

[[actions]]
id = "preview_rows"
label = "Preview Rows"
required = true

[[actions]]
id = "import_full"
label = "Import"
required = true

[[options]]
id = "header_row"
label = "Header Row"
type = "boolean"
default = true
required = true

[[options]]
id = "delimiter"
label = "Delimiter"
type = "string"
default = ","
required = true

[[options]]
id = "encoding"
label = "Encoding"
type = "enumeration"
default = "auto"
allowed_values = ["auto", "utf8", "latin1"]
required = true

[[type_mappings]]
source_type = "text"
target_type = "TEXT"
fidelity = "coerced"
notes = "Delimited files do not carry native types; DecentDB types are inferred from samples and can be overridden."

[[checks]]
id = "csv.type_inference_confidence"
name = "Type Inference Confidence"
description = "Warn when sampled values imply mixed type intent in one column."
default_enabled = true
severity = "warning"
quality_profile = "default_import_quality"

[documentation]
help_topic = "importing-data"
format_docs = "README.md"
fixture_notes = "fixtures/README.md"

[[fixtures]]
id = "basic"
path = "fixtures/basic.csv"
purpose = "Headers, scalar rows, and inferred numeric columns."
expected_tables = ["basic"]
expected_warnings = []
