<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decent Bench Screenshots</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .carousel { position: relative; width: 80%; margin:auto; }
  .carousel-images { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .carousel-images a { display: block; }
  .carousel-images img { width: 100%; display: none; border-radius: 12px; }
  .carousel-images img.active { display: block; }
  .carousel-images img:hover { cursor: pointer; }
  .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 28px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .nav-btn:hover { background: rgba(0,0,0,0.8); }
  .nav-btn.prev { left: 12px; }
  .nav-btn.next { right: 12px; }
  .dots { text-align: center; margin-top: 14px; }
  .dot { display: inline-block; width: 12px; height: 12px; margin: 0 6px; border-radius: 50%; background: #30363d; cursor: pointer; transition: background 0.2s; }
  .dot.active { background: #58a6ff; }
  .counter { text-align: center; color: #8b949e; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="carousel" id="carousel">
  <div class="carousel-images" id="slides">
    <a href="screenshot.png" target="_blank"><img src="screenshot.png" alt="Decent Bench — Schema Explorer" class="active" data-index="0"></a>
    <a href="screenshot1.png" target="_blank"><img src="screenshot1.png" alt="Decent Bench — Import Wizard" data-index="1"></a>
    <a href="screenshot2.png" target="_blank"><img src="screenshot2.png" alt="Decent Bench — Query Editor" data-index="2"></a>
  </div>
  <button class="nav-btn prev" onclick="changeSlide(-1)">&#8249;</button>
  <button class="nav-btn next" onclick="changeSlide(1)">&#8250;</button>
  <div class="dots" id="dots"></div>
  <div class="counter" id="counter"></div>
</div>
<script>
  const images = document.querySelectorAll('#slides img');
  const dotsContainer = document.getElementById('dots');
  const counter = document.getElementById('counter');
  let current = 0;
  let timer = null;
  const INTERVAL = 30000;

  images.forEach((img, i) => {
    const dot = document.createElement('span');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goTo(i);
    dotsContainer.appendChild(dot);
  });

  function goTo(index) {
    images[current].classList.remove('active');
    dotsContainer.children[current].classList.remove('active');
    current = (index + images.length) % images.length;
    images[current].classList.add('active');
    dotsContainer.children[current].classList.add('active');
    counter.textContent = (current + 1) + ' / ' + images.length;
    resetTimer();
  }

  function changeSlide(delta) { goTo(current + delta); }

  function resetTimer() {
    clearInterval(timer);
    timer = setInterval(() => changeSlide(1), INTERVAL);
  }

  goTo(0);
</script>
</body>
</html>
